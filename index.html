<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Rater Tara</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at top left,
          #064f4f 0%,
          #002e2e 35%,
          #001719 100%
        );
    }

    .admin-app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding-bottom: 40px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 15px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(0, 25, 27, .92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      color: #002e2e;

      background:
        linear-gradient(
          135deg,
          #00ffff,
          #ffcc00
        );
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: #7da2a2;
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;

      color: #fff;
      background: rgba(255,255,255,.07);

      text-decoration: none;
      cursor: pointer;
    }

    .icon-btn:hover {
      color: #00ffff;
    }


    /* =====================================================
       ADMIN INFO
       ===================================================== */

    .admin-info {
      margin: 18px 15px 0;
      padding: 18px;

      display: flex;
      align-items: center;
      gap: 14px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.08);
    }

    .admin-avatar {
      width: 55px;
      height: 55px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #002e2e;
      background: #00ffff;

      font-size: 23px;
      font-weight: 900;
    }

    .admin-name {
      font-size: 16px;
      font-weight: 800;
    }

    .admin-email {
      margin-top: 5px;
      color: #82a5a5;
      font-size: 12px;
      word-break: break-word;
    }

    .admin-badge {
      margin-left: auto;

      padding: 7px 11px;

      border-radius: 20px;

      color: #002e2e;
      background: #ffcc00;

      font-size: 10px;
      font-weight: 900;
    }


    /* =====================================================
       DASHBOARD GRID
       ===================================================== */

    .dashboard {
      padding: 0 15px;
    }

    .section-title {
      margin: 23px 3px 13px;

      font-size: 18px;
      font-weight: 900;
    }

    .section-title i {
      color: #ffcc00;
      margin-right: 7px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);

      gap: 11px;
    }

    .stat-card {
      min-height: 115px;

      padding: 17px;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(0,82,82,.65),
          rgba(0,38,40,.7)
        );

      border:
        1px solid rgba(255,255,255,.07);
    }

    .stat-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      color: #00ffff;
      background: rgba(0,255,255,.08);
    }

    .stat-number {
      margin-top: 10px;

      font-size: 24px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 4px;

      color: #7fa3a3;

      font-size: 11px;
    }


    /* =====================================================
       QUICK ACTIONS
       ===================================================== */

    .actions-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .action {
      min-height: 85px;

      padding: 15px;

      border-radius: 17px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      color: #fff;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.08);

      text-decoration: none;

      transition: .2s;
    }

    .action:hover {
      transform: translateY(-2px);

      border-color:
        rgba(0,255,255,.25);
    }

    .action i {
      margin-bottom: 9px;

      color: #00ffff;

      font-size: 20px;
    }

    .action span {
      font-size: 13px;
      font-weight: 700;
    }


    /* =====================================================
       VIDEO TABLE
       ===================================================== */

    .video-list {
      display: grid;
      gap: 10px;
    }

    .video-row {
      padding: 12px;

      display: flex;
      gap: 12px;
      align-items: center;

      border-radius: 16px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.07);
    }

    .video-thumb {
      width: 105px;
      height: 62px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 10px;

      background: #002222;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-details {
      min-width: 0;
      flex: 1;
    }

    .video-title {
      font-size: 13px;
      font-weight: 800;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .video-meta {
      margin-top: 6px;

      color: #7e9e9e;

      font-size: 10px;
    }

    .status {
      padding: 5px 8px;

      flex-shrink: 0;

      border-radius: 15px;

      font-size: 9px;
      font-weight: 800;
    }

    .status-published {
      color: #002e2e;
      background: #00ffff;
    }

    .status-pending {
      color: #002e2e;
      background: #ffcc00;
    }

    .status-rejected {
      color: #fff;
      background: #c52d2d;
    }

    .status-other {
      color: #fff;
      background: #456565;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: #8eaaaa;
    }

    .loading i {
      margin-bottom: 12px;
      font-size: 30px;
      color: #00ffff;
    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error {
      margin: 20px 15px;
      padding: 20px;

      text-align: center;

      border-radius: 18px;

      background:
        rgba(255,50,50,.08);

      border:
        1px solid rgba(255,50,50,.2);

      color: #ffb0b0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (min-width: 700px) {

      .stats-grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .actions-grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .video-list {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 420px) {

      .brand-title {
        font-size: 16px;
      }

      .admin-badge {
        display: none;
      }

      .video-thumb {
        width: 90px;
        height: 55px;
      }

    }
  </style>
</head>


<body>

<div class="admin-app">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="brand">

      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <div>
        <div class="brand-title">
          Rater Tara Admin
        </div>

        <div class="brand-subtitle">
          Video Platform Control Panel
        </div>
      </div>

    </div>


    <div class="header-actions">

      <a
        href="../index.html"
        class="icon-btn"
        title="Home">

        <i class="fa-solid fa-house"></i>

      </a>


      <button
        id="logoutBtn"
        class="icon-btn"
        title="Logout">

        <i class="fa-solid fa-right-from-bracket"></i>

      </button>

    </div>

  </header>



  <!-- =====================================================
       ADMIN INFO
       ===================================================== -->

  <div
    id="adminInfo"
    class="admin-info"
    style="display:none;">

    <div
      id="adminAvatar"
      class="admin-avatar">
      A
    </div>

    <div>

      <div
        id="adminName"
        class="admin-name">
        Admin
      </div>

      <div
        id="adminEmail"
        class="admin-email">
        -
      </div>

    </div>

    <div class="admin-badge">
      ADMIN
    </div>

  </div>



  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    id="loading"
    class="loading">

    <i class="fa-solid fa-spinner fa-spin"></i>

    <div>
      Admin Dashboard লোড হচ্ছে...
    </div>

  </div>



  <!-- =====================================================
       DASHBOARD
       ===================================================== -->

  <main
    id="dashboard"
    class="dashboard"
    style="display:none;">


    <!-- Statistics -->

    <div class="section-title">
      <i class="fa-solid fa-chart-line"></i>
      Dashboard Overview
    </div>


    <div class="stats-grid">


      <div class="stat-card">

        <div class="stat-icon">
          <i class="fa-solid fa-video"></i>
        </div>

        <div
          id="totalVideos"
          class="stat-number">
          0
        </div>

        <div class="stat-label">
          Total Videos
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">
          <i class="fa-solid fa-circle-check"></i>
        </div>

        <div
          id="publishedVideos"
          class="stat-number">
          0
        </div>

        <div class="stat-label">
          Published
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">
          <i class="fa-solid fa-clock"></i>
        </div>

        <div
          id="pendingVideos"
          class="stat-number">
          0
        </div>

        <div class="stat-label">
          Pending
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-icon">
          <i class="fa-solid fa-users"></i>
        </div>

        <div
          id="totalUsers"
          class="stat-number">
          0
        </div>

        <div class="stat-label">
          Users
        </div>

      </div>

    </div>



    <!-- =================================================
         QUICK ACTIONS
         ================================================= -->

    <div class="section-title">
      <i class="fa-solid fa-bolt"></i>
      Quick Actions
    </div>


    <div class="actions-grid">


      <a
        href="../upload.html"
        class="action">

        <i class="fa-solid fa-cloud-arrow-up"></i>

        <span>
          Upload Video
        </span>

      </a>


      <a
        href="../index.html"
        class="action">

        <i class="fa-solid fa-globe"></i>

        <span>
          View Website
        </span>

      </a>


      <a
        href="../search.html"
        class="action">

        <i class="fa-solid fa-magnifying-glass"></i>

        <span>
          Search Videos
        </span>

      </a>


      <a
        href="../favorites.html"
        class="action">

        <i class="fa-solid fa-heart"></i>

        <span>
          Favorites
        </span>

      </a>

    </div>



    <!-- =================================================
         RECENT VIDEOS
         ================================================= -->

    <div class="section-title">
      <i class="fa-solid fa-clock-rotate-left"></i>
      Recent Videos
    </div>


    <div
      id="videoList"
      class="video-list">

    </div>


  </main>

</div>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script type="module">

  import {
    auth,
    db
  } from "../js/firebase.js";


  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";


  import {
    collection,
    getDocs,
    query,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";


  const loading =
    document.getElementById("loading");

  const dashboard =
    document.getElementById("dashboard");

  const adminInfo =
    document.getElementById("adminInfo");

  const adminName =
    document.getElementById("adminName");

  const adminEmail =
    document.getElementById("adminEmail");

  const adminAvatar =
    document.getElementById("adminAvatar");


  const totalVideos =
    document.getElementById("totalVideos");

  const publishedVideos =
    document.getElementById("publishedVideos");

  const pendingVideos =
    document.getElementById("pendingVideos");

  const totalUsers =
    document.getElementById("totalUsers");

  const videoList =
    document.getElementById("videoList");


  const logoutBtn =
    document.getElementById("logoutBtn");



  // =====================================================
  // CHECK ADMIN
  // =====================================================

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      try {

        const userQuery =
          query(
            collection(db, "users")
          );


        const usersSnapshot =
          await getDocs(userQuery);


        let currentAdmin = null;


        usersSnapshot.forEach(
          (docSnap) => {

            if (
              docSnap.id === user.uid
            ) {

              currentAdmin =
                docSnap.data();

            }

          }
        );


        if (
          !currentAdmin ||
          currentAdmin.role !== "admin"
        ) {

          alert(
            "আপনার Admin permission নেই।"
          );

          window.location.href =
            "../index.html";

          return;
        }


        // Admin information

        const name =
          currentAdmin.name ||
          currentAdmin.displayName ||
          user.displayName ||
          "Admin";


        adminName.textContent =
          name;

        adminEmail.textContent =
          user.email || "-";


        adminAvatar.textContent =
          name
            .trim()
            .charAt(0)
            .toUpperCase() || "A";


        adminInfo.style.display =
          "flex";


        await loadDashboard();


        loading.style.display =
          "none";

        dashboard.style.display =
          "block";

      }

      catch (error) {

        console.error(error);

        loading.innerHTML = `
          <div class="error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <br><br>
            Admin Dashboard লোড করা যায়নি।
            <br>
            Firebase Rules এবং Admin role পরীক্ষা করুন।
          </div>
        `;

      }

    }
  );



  // =====================================================
  // LOAD DASHBOARD
  // =====================================================

  async function loadDashboard() {

    // -----------------------------------------------------
    // VIDEOS
    // -----------------------------------------------------

    const videosSnapshot =
      await getDocs(
        collection(db, "videos")
      );


    let total = 0;
    let published = 0;
    let pending = 0;


    const videos = [];


    videosSnapshot.forEach(
      (docSnap) => {

        const data =
          docSnap.data();


        total++;


        if (
          data.status ===
          "published"
        ) {

          published++;

        }


        if (
          data.status ===
          "pending"
        ) {

          pending++;

        }


        videos.push({
          id: docSnap.id,
          ...data
        });

      }
    );


    totalVideos.textContent =
      total;

    publishedVideos.textContent =
      published;

    pendingVideos.textContent =
      pending;



    // -----------------------------------------------------
    // USERS
    // -----------------------------------------------------

    try {

      const usersSnapshot =
        await getDocs(
          collection(db, "users")
        );

      totalUsers.textContent =
        usersSnapshot.size;

    }

    catch (error) {

      console.error(
        "Users loading error:",
        error
      );

      totalUsers.textContent =
        "—";

    }



    // -----------------------------------------------------
    // RECENT VIDEOS
    // -----------------------------------------------------

    videos.sort(
      (a, b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    renderVideos(
      videos.slice(0, 10)
    );

  }



  // =====================================================
  // RENDER VIDEOS
  // =====================================================

  function renderVideos(videos) {

    if (!videos.length) {

      videoList.innerHTML = `
        <div class="loading">
          <i class="fa-solid fa-video-slash"></i>
          <br>
          এখনো কোনো ভিডিও নেই।
        </div>
      `;

      return;
    }


    videoList.innerHTML =
      videos.map(
        (video) => {

          const status =
            video.status ||
            "unknown";


          let statusClass =
            "status-other";


          if (
            status ===
            "published"
          ) {

            statusClass =
              "status-published";

          }
          else if (
            status ===
            "pending"
          ) {

            statusClass =
              "status-pending";

          }
          else if (
            status ===
            "rejected"
          ) {

            statusClass =
              "status-rejected";

          }


          return `
            <div class="video-row">

              <div class="video-thumb">

                <img
                  src="${escapeHtml(
                    video.thumbnail ||
                    "https://via.placeholder.com/320x180/002e2e/00ffff?text=Rater+Tara"
                  )}"
                  alt="Video">

              </div>


              <div class="video-details">

                <div class="video-title">
                  ${escapeHtml(
                    video.title ||
                    "Untitled Video"
                  )}
                </div>

                <div class="video-meta">

                  ${escapeHtml(
                    video.category ||
                    "General"
                  )}

                  •

                  ${Number(
                    video.views || 0
                  )} views

                </div>

              </div>


              <div
                class="status ${statusClass}">

                ${escapeHtml(
                  status.toUpperCase()
                )}

              </div>

            </div>
          `;

        }
      ).join("");

  }



  // =====================================================
  // HTML ESCAPE
  // =====================================================

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }



  // =====================================================
  // LOGOUT
  // =====================================================

  logoutBtn.addEventListener(
    "click",
    async () => {

      const confirmLogout =
        confirm(
          "আপনি কি Admin Logout করতে চান?"
        );


      if (!confirmLogout) {
        return;
      }


      try {

        await signOut(auth);

        window.location.href =
          "login.html";

      }

      catch (error) {

        console.error(error);

        alert(
          "Logout করা যায়নি।"
        );

      }

    }
  );

</script>

</body>
</html>
