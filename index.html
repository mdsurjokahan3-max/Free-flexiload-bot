<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RATER TARA – VIDEO APP</title>

  <meta name="description" content="Rater Tara Video App">
  <meta name="theme-color" content="#002e2e">

  <link rel="stylesheet" href="./css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #004b4b 0%, #002e2e 38%, #00181b 100%);
      color: #fff;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: 100%;
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* ================= HEADER ================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 16px;
      background: rgba(0, 25, 27, .88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      object-fit: cover;
      background: #004444;
      border: 1px solid rgba(255,255,255,.12);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .7px;
    }

    .brand-text p {
      margin: 3px 0 0;
      font-size: 11px;
      color: #9becec;
    }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,.12);
    }

    /* ================= HERO ================= */

    .hero {
      margin: 18px 14px 14px;
      padding: 24px 20px;
      border-radius: 24px;

      background:
        linear-gradient(135deg,
        rgba(0,255,255,.13),
        rgba(255,204,0,.09));

      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 18px 45px rgba(0,0,0,.25);
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(0,255,255,.1);
      color: #00ffff;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
    }

    .hero h2 span {
      color: #ffcc00;
    }

    .hero p {
      margin: 10px 0 0;
      color: #b7d7d7;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ================= SEARCH ================= */

    .search-wrap {
      padding: 0 14px 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 13px 15px;
      border-radius: 16px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.09);
    }

    .search-box span {
      font-size: 18px;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #8ca9aa;
    }

    /* ================= SECTION ================= */

    .section {
      padding: 8px 14px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .section-head a {
      color: #00ffff;
      font-size: 12px;
    }

    /* ================= CATEGORY ================= */

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      padding: 9px 14px;
      border-radius: 30px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #d9eeee;
      font-size: 12px;
    }

    .category.active {
      background: #ffcc00;
      color: #002e2e;
      font-weight: bold;
    }

    /* ================= VIDEO GRID ================= */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .video-card {
      overflow: hidden;
      border-radius: 18px;
      background: rgba(0,68,68,.72);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 12px 28px rgba(0,0,0,.2);
      transition: transform .2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #003737;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 45px;
      height: 45px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,.65);
      border: 2px solid rgba(255,255,255,.75);
      color: #fff;
      font-size: 18px;
      padding-left: 3px;
    }

    .video-info {
      padding: 11px;
    }

    .video-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
      color: #91b5b5;
      font-size: 10px;
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 35px 15px;
      color: #9ebcbc;
      font-size: 13px;
    }

    .error {
      color: #ffb4b4;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);

      width: min(620px, calc(100% - 20px));

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 8px;

      background: rgba(0,25,27,.92);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;

      box-shadow: 0 15px 45px rgba(0,0,0,.45);
    }

    .nav-item {
      padding: 8px 4px;
      text-align: center;
      border-radius: 15px;
      color: #91b5b5;
      font-size: 10px;
    }

    .nav-item .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      background: rgba(255,204,0,.12);
      color: #ffcc00;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 420px) {

      .hero h2 {
        font-size: 22px;
      }

      .video-grid {
        gap: 9px;
      }

      .video-info {
        padding: 9px;
      }

      .video-title {
        font-size: 12px;
      }
    }

    @media (min-width: 700px) {

      .video-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ================= HEADER ================= -->

  <header class="topbar">

    <a href="./index.html" class="brand">

      <img
        src="./images/logo.png"
        class="logo"
        alt="Rater Tara Logo"
        onerror="this.style.display='none'"
      >

      <div class="brand-text">
        <h1>RATER TARA</h1>
        <p>VIDEO APP</p>
      </div>

    </a>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="location.href='./search.html'"
        title="Search">
        🔍
      </button>

      <button
        class="icon-btn"
        onclick="location.href='./profile.html'"
        title="Profile">
        👤
      </button>

    </div>

  </header>


  <!-- ================= HERO ================= -->

  <section class="hero">

    <div class="hero-badge">
      🎬 PREMIUM VIDEO PLATFORM
    </div>

    <h2>
      আপনার পছন্দের ভিডিও
      <span>এক জায়গায়</span>
    </h2>

    <p>
      নতুন ও জনপ্রিয় ভিডিও খুঁজুন,
      দেখুন এবং আপনার পছন্দের ভিডিও
      Favorites-এ সংরক্ষণ করুন।
    </p>

  </section>


  <!-- ================= SEARCH ================= -->

  <div class="search-wrap">

    <div class="search-box">

      <span>🔎</span>

      <input
        type="search"
        id="searchInput"
        placeholder="ভিডিও খুঁজুন..."
        autocomplete="off"
      >

    </div>

  </div>


  <!-- ================= CATEGORIES ================= -->

  <section class="section">

    <div class="section-head">

      <h3>📂 ক্যাটাগরি</h3>

      <a href="./categories.html">
        সব দেখুন →
      </a>

    </div>

    <div class="categories">

      <button class="category active" data-category="all">
        সব
      </button>

      <button class="category" data-category="Entertainment">
        Entertainment
      </button>

      <button class="category" data-category="Music">
        Music
      </button>

      <button class="category" data-category="Sports">
        Sports
      </button>

      <button class="category" data-category="News">
        News
      </button>

      <button class="category" data-category="Education">
        Education
      </button>

    </div>

  </section>


  <!-- ================= VIDEOS ================= -->

  <section class="section">

    <div class="section-head">

      <h3>🔥 Latest Videos</h3>

      <a href="./hot-videos.html">
        Hot Videos →
      </a>

    </div>

    <div
      id="videoGrid"
      class="video-grid">

      <div class="loading">
        ⏳ ভিডিও লোড হচ্ছে...
      </div>

    </div>

  </section>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <a
    href="./index.html"
    class="nav-item active">

    <span class="nav-icon">🏠</span>
    Home

  </a>

  <a
    href="./categories.html"
    class="nav-item">

    <span class="nav-icon">📂</span>
    Categories

  </a>

  <a
    href="./favorites.html"
    class="nav-item">

    <span class="nav-icon">❤️</span>
    Favorites

  </a>

  <a
    href="./profile.html"
    class="nav-item">

    <span class="nav-icon">👤</span>
    Profile

  </a>

</nav>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import { db } from "./js/firebase.js";

  import {
    collection,
    getDocs,
    query,
    where,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";


  const videoGrid =
    document.getElementById("videoGrid");

  const searchInput =
    document.getElementById("searchInput");

  const categoryButtons =
    document.querySelectorAll(".category");


  let allVideos = [];
  let selectedCategory = "all";


  // ========================================
  // LOAD PUBLISHED VIDEOS
  // ========================================

  async function loadVideos() {

    videoGrid.innerHTML = `
      <div class="loading">
        ⏳ ভিডিও লোড হচ্ছে...
      </div>
    `;

    try {

      const videosRef =
        collection(db, "videos");

      const q = query(
        videosRef,
        where("status", "==", "published"),
        orderBy("createdAt", "desc"),
        limit(50)
      );

      const snapshot =
        await getDocs(q);

      allVideos = [];

      snapshot.forEach(docSnap => {

        allVideos.push({
          id: docSnap.id,
          ...docSnap.data()
        });

      });

      renderVideos();

    } catch (error) {

      console.error(
        "Video loading error:",
        error
      );

      /*
       Firebase index না থাকলে সাধারণত
       console-এ একটি index creation link
       দেখাবে।
      */

      videoGrid.innerHTML = `
        <div class="error">

          ❌ ভিডিও লোড করা যায়নি।

          <br><br>

          Firebase Console-এর Firestore
          Index / Rules এবং Internet Connection
          পরীক্ষা করুন।

        </div>
      `;
    }

  }


  // ========================================
  // RENDER VIDEOS
  // ========================================

  function renderVideos() {

    const keyword =
      searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
      allVideos.filter(video => {

        const title =
          String(video.title || "")
            .toLowerCase();

        const category =
          String(video.category || "")
            .toLowerCase();


        const categoryMatch =
          selectedCategory === "all" ||
          category ===
          selectedCategory.toLowerCase();


        const searchMatch =
          !keyword ||
          title.includes(keyword) ||
          category.includes(keyword);


        return categoryMatch &&
               searchMatch;

      });


    if (!filtered.length) {

      videoGrid.innerHTML = `
        <div class="empty">

          🎬 কোনো Published Video পাওয়া যায়নি।

          <br>

          পরে আবার চেষ্টা করুন।

        </div>
      `;

      return;
    }


    videoGrid.innerHTML =
      filtered.map(video => {

        const title =
          escapeHtml(video.title || "Untitled Video");

        const category =
          escapeHtml(video.category || "Video");

        const thumbnail =
          escapeHtml(
            video.thumbnail ||
            "https://via.placeholder.com/640x360?text=RATER+TARA"
          );

        const views =
          Number(video.views || 0);


        return `

          <a
            href="./player.html?id=${encodeURIComponent(video.id)}"
            class="video-card">

            <div class="thumb-wrap">

              <img
                src="${thumbnail}"
                alt="${title}"
                loading="lazy"
                onerror="
                  this.src='https://via.placeholder.com/640x360?text=RATER+TARA'
                "
              >

              <div class="play">
                ▶
              </div>

            </div>

            <div class="video-info">

              <h4 class="video-title">
                ${title}
              </h4>

              <div class="video-meta">

                <span>
                  ${category}
                </span>

                <span>
                  👁 ${views}
                </span>

              </div>

            </div>

          </a>

        `;

      }).join("");

  }


  // ========================================
  // SEARCH
  // ========================================

  searchInput.addEventListener(
    "input",
    renderVideos
  );


  // ========================================
  // CATEGORY
  // ========================================

  categoryButtons.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        categoryButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedCategory =
          button.dataset.category;

        renderVideos();

      }
    );

  });


  // ========================================
  // HTML ESCAPE
  // ========================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ========================================
  // START
  // ========================================

  loadVideos();

</script>

</body>
</html>
