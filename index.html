<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>এডমিন প্যানেল</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #ff4d6d; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>বিজ্ঞাপন পাবলিশ করুন</h2>
        <input type="text" id="name" placeholder="নাম">
        <input type="text" id="age" placeholder="বয়স">
        <input type="text" id="dist" placeholder="জেলা">
        <textarea id="bio" placeholder="বর্ণনা"></textarea>
        <input type="text" id="img" placeholder="ছবির ডিরেক্ট ইউআরএল">
        <input type="text" id="call" placeholder="মোবাইল নম্বর">
        <button onclick="publish()">পাবলিশ</button>
        <div id="list" style="margin-top:20px;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://ratertara-rfgd-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function publish() {
            const data = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                dist: document.getElementById('dist').value,
                bio: document.getElementById('bio').value,
                img: document.getElementById('img').value,
                call: document.getElementById('call').value
            };
            db.ref('profiles').push(data).then(() => alert("পাবলিশ হয়েছে!"));
        }

        db.ref('profiles').on('value', snap => {
            const l = document.getElementById('list');
            l.innerHTML = '';
            snap.forEach(c => {
                l.innerHTML += `<div style="background:#eee; padding:5px; margin-top:5px;">${c.val().name} <button onclick="db.ref('profiles').child('${c.key}').remove()">Delete</button></div>`;
            });
        });
    </script>
</body>
</html>
